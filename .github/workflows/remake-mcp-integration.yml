name: REMAKE MCP integration
on:
  push:
    branches: [main]
    paths:
      - 'plugins/remake-by-objekts/**/*.mjs'
      - '.github/workflows/remake-mcp-integration.yml'
  pull_request:
    paths:
      - 'plugins/remake-by-objekts/**'
      - '.github/workflows/remake-mcp-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise MCP JSON-RPC dispatcher and image byte integrity
        run: node plugins/remake-by-objekts/tests/mcp-integration-v030.mjs
      - name: Assert unauthenticated calls cannot forge approval, LOCK or media observation
        run: node plugins/remake-by-objekts/tests/public-delta-guard-v033.mjs
      - name: Bound hostile request bodies before reading into memory
        run: node plugins/remake-by-objekts/tests/request-body-v035.mjs
      - name: Staging draft route shares public approval safety boundary
        run: node plugins/remake-by-objekts/tests/account-draft-boundary-v035.mjs
      - name: Check portable author constraints and actual submission contract
        run: node plugins/remake-by-objekts/tests/submission-contract-v0351.mjs
      - name: Preserve prior runtime compatibility and verify actual method retrieval
        run: |
          node plugins/remake-by-objekts/tests/audit-runtime-compat-v037.mjs
          node plugins/remake-by-objekts/tests/audit-method-contract-v037.mjs
      - name: Verify SKRIPT information routes, links, privacy scope and unchanged origin policy
        run: node plugins/remake-by-objekts/tests/skript-site-v077.mjs
