name: Publish REMAKE to official MCP Registry
on:
  push:
    branches: [main]
    paths:
      - 'plugins/remake-by-objekts/server.json'
      - '.github/workflows/remake-registry-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remake-official-registry
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'peach420fuzz/plugin-marketplace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact MCP dispatcher and permission boundary
        run: |
          node plugins/remake-by-objekts/tests/mcp-integration-v030.mjs
          node plugins/remake-by-objekts/tests/public-delta-guard-v033.mjs
      - name: Verify public endpoint and version before publication
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          server=json.loads(Path('plugins/remake-by-objekts/server.json').read_text())
          payload=json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'official-registry-preflight','version':'1'}}}).encode()
          request=urllib.request.Request(server['remotes'][0]['url'],data=payload,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=20) as response: reply=json.load(response)
          assert reply['result']['serverInfo']['version']==server['version']
          print('Live endpoint matches declared registry version')
          PY
      - name: Install checksum-pinned official publisher
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz --output publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Validate registry declaration
        run: ./mcp-publisher validate plugins/remake-by-objekts/server.json
      - name: Authenticate with repository OIDC identity
        run: ./mcp-publisher login github-oidc
      - name: Publish remote server metadata
        run: ./mcp-publisher publish plugins/remake-by-objekts/server.json
