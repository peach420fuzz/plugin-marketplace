name: REMAKE complete package
on:
  push:
    branches: [main]
    paths:
      - 'plugins/remake-by-objekts/**'
      - '.github/workflows/remake-package.yml'
  pull_request:
    paths:
      - 'plugins/remake-by-objekts/**'
      - '.github/workflows/remake-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure real video decoder from signed Ubuntu packages
        timeout-minutes: 12
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Use Ubuntu's official HTTPS archive when the runner's Azure mirror is slow.
            # Keep the source suites, components, Signed-By keys and APT verification intact.
            sudo python3 - <<'PYTHON'
          from pathlib import Path
          sources = [Path('/etc/apt/sources.list')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          # New runner images use mirror+file: entries; their URLs live here.
          sources += [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/apt-security-mirrors.txt')]
          for source in sources:
              if not source.is_file():
                  continue
              text = source.read_text()
              updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              updated = updated.replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              updated = updated.replace('http://security.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu')
              if updated != text:
                  source.write_text(updated)
                  print(f'Updated Ubuntu mirror configuration: {source}')
              for line in updated.splitlines():
                  if 'archive.ubuntu.com' in line or 'security.ubuntu.com' in line:
                      print(f'Ubuntu mirror: {line.strip()}')
          PYTHON
            sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update -qq
            sudo env DEBIAN_FRONTEND=noninteractive timeout 480s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
          ffmpeg -nostdin -v error -f lavfi -i color=c=black:s=16x16:r=1 -frames:v 1 -f null -
      - name: Verify generated public audit method matches its six canonical sources
        run: |
          python plugins/remake-by-objekts/scripts/build-audit-method-v037.py --out /tmp/remake-audit-method.mjs
          cmp /tmp/remake-audit-method.mjs plugins/remake-by-objekts/audit-method-data-v037.mjs
      - name: Full exported Python regression including pixel/frame identity
        env:
          PYTHONPATH: plugins/remake-by-objekts/skills/creative-companion/scripts
        run: |
          ffmpeg -version | head -1
          python -m unittest discover -s plugins/remake-by-objekts/eval -p 'test*.py' -v
      - name: Rebuild and inspect complete package twice
        run: |
          python plugins/remake-by-objekts/scripts/build-plugin-v035.py --out /tmp/remake-a.zip
          python plugins/remake-by-objekts/scripts/build-plugin-v035.py --out /tmp/remake-b.zip
          cmp /tmp/remake-a.zip /tmp/remake-b.zip
          python -m zipfile -t /tmp/remake-a.zip
      - uses: actions/upload-artifact@v4
        with:
          name: remake-private-candidate
          path: |
            /tmp/remake-a.zip
            /tmp/remake-a.manifest.json
          retention-days: 14
      - name: Build and validate full public review candidate with source-owned artwork
        run: |
          python plugins/remake-by-objekts/scripts/build-public-review-v0351.py --assets plugins/remake-by-objekts/assets --out /tmp/remake-public-a.zip
          python plugins/remake-by-objekts/scripts/build-public-review-v0351.py --assets plugins/remake-by-objekts/assets --out /tmp/remake-public-b.zip
          cmp /tmp/remake-public-a.zip /tmp/remake-public-b.zip
      - uses: actions/upload-artifact@v4
        with:
          name: remake-public-review-candidate
          path: |
            /tmp/remake-public-a.zip
            /tmp/remake-public-a.manifest.json
          retention-days: 14
